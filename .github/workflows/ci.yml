name: Game CI
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax, logic and live Socket.IO integration
        run: npm run build
      - name: Test health endpoint and static assets
        run: |
          npm start &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          sleep 3
          curl --fail --silent http://127.0.0.1:3000/health
          curl --fail --silent http://127.0.0.1:3000/ > /dev/null
          curl --fail --silent http://127.0.0.1:3000/app.js > /dev/null
          curl --fail --silent http://127.0.0.1:3000/features.js > /dev/null
      - name: Install real Chromium for browser tests
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Three-user end-to-end browser gameplay
        run: node tests/browser-smoke.js
      - name: Teacher with 1 and 3 students in isolated Chromium browsers
        run: node tests/room-sizes-browser.js
      - name: Public Render HTTP health and UI verification
        env:
          TARGET_URL: https://defuse-a-bomb.onrender.com
        run: |
          for i in $(seq 1 15); do
            if curl --fail --silent --show-error --max-time 25 "$TARGET_URL/health" -o /tmp/live-health.json && grep -q '"ok":true' /tmp/live-health.json; then
              break
            fi
            sleep 10
          done
          grep -q '"ok":true' /tmp/live-health.json
          curl --fail --silent --show-error --max-time 30 "$TARGET_URL/api/info" | tee /tmp/live-info.json
          grep -q '"version":"1.2.0"' /tmp/live-info.json
          # Save complete responses before asserting, avoiding early pipe closure with grep -q.
          curl --fail --silent --show-error --max-time 30 "$TARGET_URL/" -o /tmp/live-index.html
          grep -q '數位危機處理局' /tmp/live-index.html
          curl --fail --silent --show-error --max-time 30 "$TARGET_URL/app.js" -o /tmp/live-app.js
          grep -q 'socket' /tmp/live-app.js
          curl --fail --silent --show-error --max-time 30 "$TARGET_URL/features.js" -o /tmp/live-features.js
          grep -q 'watchWindow' /tmp/live-features.js
          curl --fail --silent --show-error --max-time 30 "$TARGET_URL/socket.io/?EIO=4&transport=polling" -o /tmp/engine-handshake.txt
          grep -q '^0' /tmp/engine-handshake.txt
          curl --fail --silent --show-error -I "$TARGET_URL/app.js?v=1.2.0" | tr -d '\r' | grep -i 'cache-control: no-store'
          grep -q 'app.js?v=1.2.0' /tmp/live-index.html
          echo "PASS production asset cache-busting, HTTP health and Engine.IO handshake"
      - name: Public Render three-user Chromium gameplay
        env:
          TARGET_URL: https://defuse-a-bomb.onrender.com
        run: |
          node tests/browser-smoke.js || {
            echo "Remote redeployment may have overlapped the room test; retrying once"
            sleep 35
            node tests/browser-smoke.js
          }
      - name: Public Render teacher + 1 / 3 student role verification
        env:
          TARGET_URL: https://defuse-a-bomb.onrender.com
        run: |
          node tests/room-sizes-browser.js || {
            echo "Remote deployment may have restarted the test room; retry once"
            sleep 35
            node tests/room-sizes-browser.js
          }
      - name: Save dashboard screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshot
          path: |
            teacher-screenshot.png
            render-teacher-screenshot.png
            render-debug-*.png
            phone-*.png
            render-phone-*.png
            local-three-student-roster.png
            render-three-student-roster.png
          if-no-files-found: ignore
